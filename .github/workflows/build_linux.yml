# D:\workspace\Fanan_web_hub\.github\workflows\build_linux.yml
#
# Sonify for Linux (x86_64): built on Ubuntu 24.04, packed as a .tar.gz of the app's folder (the
# program, and beside it the Device Compiler, the Plugin SDKs, LAME and the knob gallery), with a
# README naming the packages it needs to run (read from the program itself, below) and the VLC
# video needs (loaded by name at the first video, never linked, so ldd never names it).

name: Build Linux

on:
  push:
    branches: [ main, master, ranroby76/supabase ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: "Sonify"
  APP_VERSION: "0.2.0"
  # JUCE 9.0.1, the release the Windows build uses. Pinned, not a branch.
  JUCE_VERSION: "9.0.1"

jobs:
  build_linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # JUCE's Linux needs (ALSA, JACK, X11, FreeType, fontconfig, WebKitGTK for the page, GTK),
      # and FFmpeg's development packages for live streaming and the videos' sound.
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev ladspa-sdk \
            libavformat-dev libavcodec-dev libavdevice-dev libswscale-dev libswresample-dev libavutil-dev libavfilter-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Clone JUCE
        run: |
          git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git libs/JUCE
          echo "JUCE ${{ env.JUCE_VERSION }} -> libs/JUCE"

      # What CMakeLists.txt reads from the repository and can't do without: the panel fonts and
      # the pictures built into the page. (The knob gallery is optional: built without it.)
      - name: Verify Assets Are Present
        run: |
          MISSING=0

          for f in "assets/fanan logo.png" "assets/Sonify.png" "assets/sonify_icon.png" "fonts/fonts_license.txt"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f"
              MISSING=1
            fi
          done

          if ! ls fonts/*.ttf > /dev/null 2>&1; then
            echo "::error::no fonts/*.ttf (the panel fonts)"
            MISSING=1
          fi

          if [ ! -d "assets/knob_gallery" ]; then
            echo "::warning::no assets/knob_gallery: Sonify is built without the knob gallery"
          fi

          if [ "$MISSING" = "1" ]; then
            ls -la assets fonts || true
            exit 1
          fi

          echo "assets OK"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DJUCE_DIR="${{ github.workspace }}/libs/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel

      # The app's folder: the artefacts folder is named after the CMake target (FananWebHub), the
      # program after the product (Sonify), so it's found by name.
      - name: Verify Build
        id: find_app
        run: |
          APP_BIN=$(find build -type f -name "${APP_NAME}" -path "*_artefacts*" -perm -u+x | head -1)

          if [ -z "$APP_BIN" ]; then
            echo "::error::${APP_NAME} NOT found"
            find build -maxdepth 4 -path "*_artefacts*" | head -40
            exit 1
          fi

          APP_DIR=$(dirname "$APP_BIN")
          echo "Found $APP_BIN"
          ls -la "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> $GITHUB_OUTPUT

          # Every library it needs must be found here; one that isn't means a broken build.
          if ldd "$APP_BIN" | grep "not found"; then
            echo "::error::${APP_NAME} needs libraries that aren't there"
            exit 1
          fi

      - name: Package
        env:
          APP_DIR: ${{ steps.find_app.outputs.APP_DIR }}
        run: |
          PACKAGE="${APP_NAME}-Linux-x86_64-v${APP_VERSION}"
          mkdir -p "$PACKAGE"
          cp -R "$APP_DIR"/. "$PACKAGE/"

          cp assets/sonify_icon.png "$PACKAGE/sonify_icon.png"

          # The packages its libraries come from (Ubuntu 24.04's names), for the README.
          PACKAGES=$(ldd "$PACKAGE/${APP_NAME}" | awk '/=> \// {print $3}' \
                     | xargs -r -n1 dpkg -S 2>/dev/null | cut -d: -f1 | sort -u | tr '\n' ' ')

          cat > "$PACKAGE/sonify.desktop" << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Sonify
          Comment=Fanan's music studio
          Exec=Sonify
          Icon=sonify_icon
          Categories=AudioVideo;Audio;Music;
          Terminal=false
          DESKTOP

          cat > "$PACKAGE/README.txt" << README
          Sonify ${APP_VERSION} for Linux (x86_64) - Fanan
          ================================================

          Built on Ubuntu 24.04. To run it:

          1. Unpack this folder anywhere you can write to (your home folder, say), and keep
             everything in it together: Sonify finds its Device Compiler, Plugin SDKs, LAME
             and knob gallery beside it.

          2. Install what it runs on (Ubuntu 24.04 / Debian names):

             sudo apt install ${PACKAGES}

          3. For video (the Video lane, the Video window, the Live Show's videos), install VLC -
             Sonify plays video through the libvlc your machine has, and works without it:

             sudo apt install vlc

          4. Run ./Sonify

          Sonify keeps its settings in ~/.config/Fanan/Sonify.

          For a menu entry: edit sonify.desktop so Exec= and Icon= give this folder's full paths
          (Exec=/home/you/Sonify/Sonify, Icon=/home/you/Sonify/sonify_icon.png), then copy it to
          ~/.local/share/applications/.
          README

          tar -czf "${PACKAGE}.tar.gz" "$PACKAGE"
          ls -lh "${PACKAGE}.tar.gz"

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Linux-x86_64-v${{ env.APP_VERSION }}
          path: ${{ env.APP_NAME }}-Linux-x86_64-v*.tar.gz
          if-no-files-found: error
