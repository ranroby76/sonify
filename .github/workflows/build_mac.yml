# D:\workspace\Fanan_web_hub\.github\workflows\build_mac.yml
#
# Sonify for macOS: Sonify.app, built twice, natively on each kind of Mac (Apple Silicon on
# macos-15, Intel on macos-15-intel: the Wasmtime and wasi-sdk Sonify ships come per kind, so
# there's no one universal build), each signed, notarized and stapled when the signing secrets
# are there (the same ones as Grex's), and packed in a DMG with a link to Applications.
#
# Built without FFmpeg (-DFANAN_SYSTEM_FFMPEG=OFF): Homebrew's would have to be installed on the
# user's Mac for Sonify to start, so the Mac edition has no live streaming for now. Split into
# Stems (ONNX Runtime) and video (VLC) are Windows-only in CMakeLists.txt already.

name: Build macOS

on:
  push:
    branches: [ main, master, ranroby76/supabase ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: "Sonify"
  APP_VERSION: "0.2.0"
  # JUCE 9.0.1, the release the Windows build uses. Pinned, not a branch.
  JUCE_VERSION: "9.0.1"

jobs:
  build_mac:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: AppleSilicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel

    env:
      # At job level: the secrets context isn't available to the workflow-level env, nor to a
      # step's if:. Without the secrets the app is still built (signed ad hoc) and uploaded.
      SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE }}
      KEYCHAIN_PASSWORD: "actions-keychain-pw"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Dependencies
        run: |
          brew install ninja
          brew install cmake || brew upgrade cmake

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Clone JUCE
        run: |
          git clone --depth 1 --branch ${{ env.JUCE_VERSION }} https://github.com/juce-framework/JUCE.git libs/JUCE
          echo "JUCE ${{ env.JUCE_VERSION }} -> libs/JUCE"

      # What CMakeLists.txt reads from the repository and can't do without: the panel fonts and
      # the pictures built into the page. (The knob gallery is optional: built without it.)
      - name: Verify Assets Are Present
        run: |
          MISSING=0

          for f in "assets/fanan logo.png" "assets/Sonify.png" "assets/sonify_icon.png" "fonts/fonts_license.txt"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f"
              MISSING=1
            fi
          done

          if ! ls fonts/*.ttf > /dev/null 2>&1; then
            echo "::error::no fonts/*.ttf (the panel fonts)"
            MISSING=1
          fi

          if [ ! -d "assets/knob_gallery" ]; then
            echo "::warning::no assets/knob_gallery: Sonify is built without the knob gallery"
          fi

          if [ "$MISSING" = "1" ]; then
            ls -la assets fonts || true
            exit 1
          fi

          echo "assets OK"

      - name: Import Signing Certificate
        if: ${{ env.SIGNING_ENABLED != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain

          rm certificate.p12

      # Built natively for this Mac's kind (no CMAKE_OSX_ARCHITECTURES list): Wasmtime and the
      # device compiler are downloaded for the processor CMake sees. macOS 11 is the oldest
      # Wasmtime's Apple Silicon build runs on; the same for both, so they behave alike.
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DJUCE_DIR="${{ github.workspace }}/libs/JUCE" \
            -DFANAN_SYSTEM_FFMPEG=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      # The artefacts folder is named after the CMake target (FananWebHub), the app after the
      # product (Sonify), so it's found by name.
      - name: Verify Build
        id: find_app
        run: |
          APP_PATH=$(find build -type d -name "${APP_NAME}.app" -path "*_artefacts*" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::${APP_NAME}.app NOT found"
            find build -maxdepth 4 -path "*_artefacts*" | head -40
            exit 1
          fi

          echo "Found $APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/${APP_NAME}"
          ls -la "$APP_PATH/Contents/MacOS" "$APP_PATH/Contents/Resources"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT

      # Wasmtime compiles plugins and devices as they load (JIT); third-party plugins aren't
      # signed by Fanan (library validation off); recording and the Live Show's cameras.
      - name: Create Entitlements File
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.device.audio-input</key>
              <true/>
              <key>com.apple.security.device.camera</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "Created entitlements.plist"

      # Without the secrets: signed ad hoc as a whole (the files copied in after linking
      # included), so it runs on the Mac it's copied to once the user allows it.
      - name: Sign Ad Hoc
        if: ${{ env.SIGNING_ENABLED == '' }}
        env:
          APP_PATH: ${{ steps.find_app.outputs.APP_PATH }}
        run: |
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      # Every program and library inside first (the Device Compiler's clang and its libraries,
      # LAME), each with the hardened runtime and a timestamp as notarizing asks; the app itself
      # last, with its entitlements, since its signature covers what's inside it.
      - name: Sign App
        if: ${{ env.SIGNING_ENABLED != '' }}
        env:
          APP_PATH: ${{ steps.find_app.outputs.APP_PATH }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | grep -o '"[^"]*"' | sed 's/"//g')

          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application certificate found"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          echo "Signing with: $IDENTITY"
          MAIN="$APP_PATH/Contents/MacOS/${APP_NAME}"

          find "$APP_PATH/Contents" -type f -print0 | while IFS= read -r -d '' f; do
            if [ "$f" != "$MAIN" ] && file -b "$f" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"
            fi
          done

          codesign --force --options runtime --timestamp --entitlements entitlements.plist --sign "$IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      # Apple's notary service times out now and then: retried.
      - name: Notarize & Staple App
        if: ${{ env.SIGNING_ENABLED != '' }}
        uses: nick-fields/retry@v3
        env:
          APP_PATH: ${{ steps.find_app.outputs.APP_PATH }}
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            rm -f Sonify_notarize.zip
            /usr/bin/ditto -c -k --keepParent "$APP_PATH" Sonify_notarize.zip
            xcrun notarytool submit Sonify_notarize.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID" \
              --wait
            xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        env:
          APP_PATH: ${{ steps.find_app.outputs.APP_PATH }}
        run: |
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          ln -s /Applications dmg_contents/Applications

          cat > dmg_contents/README.txt << 'README'
          Sonify - Fanan
          ==============

          Drag Sonify to Applications, then open it from there.

          Sonify keeps its settings in ~/Library/Fanan/Sonify.

          The Mac edition doesn't have live streaming, Split into Stems or video yet.
          README

          DMG="${APP_NAME}_Mac_${{ matrix.label }}_v${APP_VERSION}.dmg"

          hdiutil create \
            -volname "${APP_NAME} v${APP_VERSION}" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG"

          ls -lh "$DMG"
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Sign, Notarize & Staple DMG
        if: ${{ env.SIGNING_ENABLED != '' }}
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | grep -o '"[^"]*"' | sed 's/"//g')
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          # Stapling and validating ask Apple's servers, whose connection drops now and then
          # ("The network connection was lost", error 68): each is tried a few times.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG"; then
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::stapling the DMG failed 5 times"
              exit 1
            fi

            echo "Stapling failed (attempt $attempt): trying again in 30 s"
            sleep 30
          done

          for attempt in 1 2 3 4 5; do
            if xcrun stapler validate "$DMG"; then
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "::error::validating the DMG's ticket failed 5 times"
              exit 1
            fi

            echo "Validating failed (attempt $attempt): trying again in 30 s"
            sleep 30
          done

          echo "DMG is signed, notarized, and stapled"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-Mac-${{ matrix.label }}-v${{ env.APP_VERSION }}
          path: ${{ env.APP_NAME }}_Mac_${{ matrix.label }}_v*.dmg
          if-no-files-found: error

      - name: Cleanup Keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true
